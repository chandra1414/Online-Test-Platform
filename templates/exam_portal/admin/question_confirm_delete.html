{% extends 'exam_portal/base.html' %}

{% block title %}Delete Question - Admin Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom p-4 text-center shadow-sm">
                <div class="rounded-circle bg-danger-subtle text-danger mx-auto p-3 mb-3" style="width: 64px; height: 64px;">
                    <i class="fa-solid fa-trash-can fs-3"></i>
                </div>
                <h4 class="fw-bold text-dark">Confirm Question Deletion</h4>
                <p class="text-muted">
                    Are you sure you want to delete Question <strong>"{{ question.title }}"</strong>?
                </p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'admin_test_detail' question.test_id %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="fa-solid fa-trash-can me-1"></i> Yes, Delete Question
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
